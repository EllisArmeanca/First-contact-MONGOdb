services:
  configsvr:
    image: mongo:6.0
    container_name: configsvr
    command: >
      mongod --configsvr --replSet csrs --port 27019
      --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - configsvr-data:/data/db

  shard1:
    image: mongo:6.0
    container_name: shard1
    command: >
      mongod --shardsvr --replSet rs1 --port 27018
      --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - shard1-data:/data/db

  shard2:
    image: mongo:6.0
    container_name: shard2
    command: >
      mongod --shardsvr --replSet rs2 --port 27020
      --bind_ip_all
    ports:
      - "27020:27020"
    volumes:
      - shard2-data:/data/db

  mongos:
    image: mongo:6.0
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: >
      mongos --configdb csrs/configsvr:27019
      --bind_ip_all --port 27017
    ports:
      - "27017:27017"

volumes:
  configsvr-data:
  shard1-data:
  shard2-data:
